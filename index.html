<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Milliy Sertifikat Testi</title>
    <script src="https://telegram.org"></script>
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] }
        };
    </script>
    <script id="MathJax-script" async src="https://jsdelivr.net"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #f4f4f9);
            color: var(--tg-theme-text-color, #222);
            margin: 0;
            padding: 16px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--tg-theme-secondary-bg-color, #fff);
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
            font-weight: bold;
        }
        .card {
            background: var(--tg-theme-secondary-bg-color, #fff);
            padding: 20px;
            border-radius: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .question-text {
            font-size: 17px;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .option-btn {
            display: block;
            width: 100%;
            text-align: left;
            padding: 14px 16px;
            margin-bottom: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            background: var(--tg-theme-bg-color, #fafafa);
            color: var(--tg-theme-text-color, #222);
            font-size: 16px;
            cursor: pointer;
        }
        .option-btn:hover { border-color: #2481cc; }
        .open-input {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            border: 2px solid #ccc;
            border-radius: 10px;
            box-sizing: border-box;
            margin-bottom: 12px;
        }
        .submit-btn {
            width: 100%;
            padding: 14px;
            background: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #fff);
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="header">
    <span id="progress">Savol: 1 / 45</span>
    <span id="theta-display">Theta: 0.0</span>
</div>

<div class="card" id="quiz-box">
    <div class="question-text" id="q-text">Savollar yuklanmoqda...</div>
    <div id="options-box"></div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let allQuestions = [];
    let ishlatilganIdlar = [];
    let theta = 0.0;
    let savolSoni = 0;
    let joriySavol = null;

    fetch('testlar.json')
        .then(res => res.json())
        .then(data => {
            allQuestions = data;
            yuborishKeyingiSavol();
        })
        .catch(() => {
            document.getElementById('q-text').innerText = "Xatolik: testlar.json yuklanmadi!";
        });

    function engMosSavol() {
        const qolganSavollar = allQuestions.filter(s => !ishlatilganIdlar.includes(s.id));
        if (qolganSavollar.length === 0) return null;
        qolganSavollar.sort((a, b) => Math.abs(a.qiyinchilik - theta) - Math.abs(b.qiyinchilik - theta));
        return qolganSavollar[0];
    }

    function yuborishKeyingiSavol() {
        joriySavol = engMosSavol();
        if (!joriySavol) {
            yakunlashTest();
            return;
        }

        savolSoni++;
        ishlatilganIdlar.push(joriySavol.id);
        document.getElementById('progress').innerText = Savol: ${savolSoni} / ${allQuestions.length};
        document.getElementById('theta-display').innerText = Theta: ${theta.toFixed(1)};

        let tozaSavol = joriySavol.savol.replace(/<b>\d+-savol:<\/b>/gi, '').trim();
        document.getElementById('q-text').innerHTML = <b>${savolSoni}-savol:</b> ${tozaSavol};

        const optBox = document.getElementById('options-box');
        optBox.innerHTML = '';

        if (joriySavol.variantlar && joriySavol.variantlar.length > 0) {
            joriySavol.variantlar.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = opt;
                btn.onclick = () => javobniTekshirish(opt);
                optBox.appendChild(btn);
            });
        } else {
            const inp = document.createElement('input');
            inp.type = 'text';
            inp.className = 'open-input';
            inp.placeholder = 'Javobingizni kiriting...';

            const subBtn = document.createElement('button');
            subBtn.className = 'submit-btn';
            subBtn.innerText = 'Tasdiqlash';
            subBtn.onclick = () => {
                if (inp.value.trim() !== '') javobniTekshirish(inp.value.trim());
            };
            optBox.appendChild(inp);
            optBox.appendChild(subBtn);
        }

        if (window.MathJax) MathJax.typesetPromise();
    }

    function javobniTekshirish(javob) {
        if (javob.trim() === (joriySavol.togri_javob || '').trim()) {
            theta += 0.3;
        } else {
            theta -= 0.3;
        }
        yuborishKeyingiSavol();
    }

    function yakunlashTest() {
        document.getElementById('quiz-box').innerHTML =
            "<h3>✅ Barcha savollar yakunlandi!</h3>" +
            "<p>Jami yechilgan savollar: <b>" + savolSoni + " ta</b></p>" +
            "<p>Yakuniy Theta darajangiz: <b>" + theta.toFixed(2) + "</b></p>" +
            "<button class='submit-btn' onclick='natijaniBotgaYuborish()'>Natijani va Sertifikat darajasini ko'rish</button>";
        ;
    }

    function natijaniBotgaYuborish() {
        tg.sendData(JSON.stringify({
            theta: Number(theta.toFixed(2)),
            savol_soni: savolSoni
        }));
    }
</script>

</body>
</html>
